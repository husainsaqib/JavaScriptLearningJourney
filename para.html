<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstAndLastName</title>
</head>
<body>
    <form>
        <label>First Name</label><br>
        <input type="text" id="firstName" placeholder="Enter first name"><br>
        <label>Last Name</label><br>
        <input type="text" id="lastName" placeholder="Enter last name"><br>
        <button type="button" onclick="displayFullName()">Submit</button>
    </form>
    <p id="one"></p>
    <script>
        function displayFullName() {
            var firstName = document.getElementById("firstName").value;
            var lastName = document.getElementById("lastName").value;
            document.getElementById("one").innerHTML = "Full Name: " + firstName + " " + lastName;

        }
    </script>
    
</body>
</html>
