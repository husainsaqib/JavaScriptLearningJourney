<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Horizon Institute of Technology</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 id="college-name">Apex Horizon Institute of Technology</h1>

            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Courses</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="form-section">

        <div class="form-container">

            <h2>Student Registration Form</h2>

            <div id="message"></div>

            <form id="registrationForm">

                <label>Student Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email">

                <label>Mobile Number</label>
                <input type="text" id="mobile" placeholder="10-digit mobile number">

                <label>Date of Birth</label>
                <input type="date" id="dob">

                <label>Gender</label>
                <div class="gender">
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                    <input type="radio" name="gender" value="Other"> Other
                </div>

                <label>Course</label>

                <select id="course">
                    <option value="">Select Course</option>
                    <option>B.Tech Computer Science</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>MBA</option>
                    <option>Artificial Intelligence</option>
                </select>

                <label>Address</label>
                <textarea id="address" rows="4"></textarea>

                <label>Password</label>
                <input type="password" id="password">

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword">

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>

            </form>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
